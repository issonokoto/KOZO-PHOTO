name: Prepare KOZO pose reference
on:
  push:
    paths:
      - .github/workflows/prepare-pose-reference.yml
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public original portraits
        run: |
          for file in assets/002.png assets/003.png; do
            printf 'KOZO_FILE_%s\n' "$file"
            base64 -w 0 "$file"
            printf '\nKOZO_FILE_END\n'
          done
